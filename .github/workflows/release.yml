name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Build, sign, and notarize macOS adapter
    runs-on: macos-latest
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build adapter
        run: |
          cargo build \
            --manifest-path bridge/Cargo.toml \
            --locked \
            --release

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner architecture: $(uname -m)"
          file bridge/target/release/tool4d-lsp-stdio

          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "This workflow currently publishes an aarch64 artifact."
            echo "The selected runner is not arm64."
            exit 1
          fi

      - name: Import Apple signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          printf '%s' "$P12_BASE64" \
            | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

      - name: Sign adapter
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail

          BINARY="bridge/target/release/tool4d-lsp-stdio"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$SIGNING_IDENTITY" \
            "$BINARY"

          codesign \
            --verify \
            --strict \
            --verbose=2 \
            "$BINARY"

          codesign \
            --display \
            --verbose=4 \
            "$BINARY"

      - name: Package adapter
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="$RUNNER_TEMP/tool4d-lsp-stdio"

          mkdir -p "$PACKAGE_DIR"

          cp \
            bridge/target/release/tool4d-lsp-stdio \
            "$PACKAGE_DIR/tool4d-lsp-stdio"

          cp README.md "$PACKAGE_DIR/README.md"
          cp LICENSE "$PACKAGE_DIR/LICENSE"

          ditto \
            -c \
            -k \
            --keepParent \
            "$PACKAGE_DIR" \
            tool4d-lsp-stdio-aarch64-apple-darwin.zip

      - name: Prepare notarization key
        env:
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"

          printf '%s' "$API_PRIVATE_KEY" > "$API_KEY_PATH"

          chmod 600 "$API_KEY_PATH"

          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Notarize adapter
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          
          if [[ -z "${APPLE_ID:-}" ]]; then
            echo "APPLE_ID is not configured"
            exit 1
          fi
          
          if [[ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
            echo "APPLE_APP_SPECIFIC_PASSWORD is not configured"
            exit 1
          fi
          
          if [[ -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "APPLE_TEAM_ID is not configured"
            exit 1
          fi
          
          xcrun notarytool submit \
          tool4d-lsp-stdio-aarch64-apple-darwin.zip \
          --apple-id "$APPLE_ID" \
          --password "$APPLE_APP_SPECIFIC_PASSWORD" \
          --team-id "$APPLE_TEAM_ID" \
          --wait

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail

          shasum -a 256 \
            tool4d-lsp-stdio-aarch64-apple-darwin.zip \
            > tool4d-lsp-stdio-aarch64-apple-darwin.zip.sha256

          cat tool4d-lsp-stdio-aarch64-apple-darwin.zip.sha256

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tool4d-lsp-stdio-macos
          path: |
            tool4d-lsp-stdio-aarch64-apple-darwin.zip
            tool4d-lsp-stdio-aarch64-apple-darwin.zip.sha256
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload \
            "$GITHUB_REF_NAME" \
            tool4d-lsp-stdio-aarch64-apple-darwin.zip \
            tool4d-lsp-stdio-aarch64-apple-darwin.zip.sha256 \
            --clobber

  windows:
    name: Build and package Windows adapter
    runs-on: windows-latest
    needs:
      - macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cargo build `
            --manifest-path bridge/Cargo.toml `
            --locked `
            --release `
            --target x86_64-pc-windows-msvc

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $binary = Join-Path `
            "bridge/target/x86_64-pc-windows-msvc/release" `
            "tool4d-lsp-stdio.exe"

          if (-not (Test-Path $binary -PathType Leaf)) {
            throw "Windows executable was not found: $binary"
          }

          $binaryFile = Get-Item $binary

          if ($binaryFile.Length -eq 0) {
            throw "Windows executable is empty: $binary"
          }

          Write-Host "Windows executable:"
          $binaryFile | Format-List FullName, Length

      - name: Package adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $binary = Join-Path `
            "bridge/target/x86_64-pc-windows-msvc/release" `
            "tool4d-lsp-stdio.exe"

          $packageDir = Join-Path `
            $env:RUNNER_TEMP `
            "tool4d-lsp-stdio"

          $asset = `
            "tool4d-lsp-stdio-x86_64-pc-windows-msvc.zip"

          if (Test-Path $packageDir) {
            Remove-Item `
              -Path $packageDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $packageDir `
            -Force |
            Out-Null

          Copy-Item `
            -Path $binary `
            -Destination (
              Join-Path $packageDir "tool4d-lsp-stdio.exe"
            )

          Copy-Item `
            -Path README.md `
            -Destination (
              Join-Path $packageDir "README.md"
            )

          Copy-Item `
            -Path LICENSE `
            -Destination (
              Join-Path $packageDir "LICENSE"
            )

          Compress-Archive `
            -Path $packageDir `
            -DestinationPath $asset `
            -CompressionLevel Optimal `
            -Force

          if (-not (Test-Path $asset -PathType Leaf)) {
            throw "Windows archive was not created: $asset"
          }

          $archive = Get-Item $asset

          if ($archive.Length -eq 0) {
            throw "Windows archive is empty: $asset"
          }

          Write-Host "Windows release asset:"
          $archive | Format-List FullName, Length

      - name: Create checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $asset = `
            "tool4d-lsp-stdio-x86_64-pc-windows-msvc.zip"

          $hash = Get-FileHash `
            -Path $asset `
            -Algorithm SHA256

          $checksum = (
            $hash.Hash.ToLowerInvariant() +
            "  " +
            $asset
          )

          Set-Content `
            -Path "${asset}.sha256" `
            -Value $checksum `
            -Encoding ascii

          Get-Content "${asset}.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tool4d-lsp-stdio-windows
          path: |
            tool4d-lsp-stdio-x86_64-pc-windows-msvc.zip
            tool4d-lsp-stdio-x86_64-pc-windows-msvc.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          gh release upload `
            $env:GITHUB_REF_NAME `
            "tool4d-lsp-stdio-x86_64-pc-windows-msvc.zip" `
            "tool4d-lsp-stdio-x86_64-pc-windows-msvc.zip.sha256" `
            --clobber