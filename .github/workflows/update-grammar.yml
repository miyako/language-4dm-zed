name: Update grammar revision

# Moves the grammar this extension pins -- `rev` under [grammars.fourd] in
# extension.toml -- to a commit in miyako/tree-sitter-fourd, and opens a pull
# request when the pin moves.
#
# Why a pin at all: Zed builds the grammar from the repository at the recorded
# `rev` and embeds the resulting wasm in the extension. The extension registry
# requires a full commit SHA there, so the pin is the only thing that decides
# which parser ships.
#
# Why this workflow and not the grammar repository: the grammar repository
# already regenerates its own src/ (update-builtins.yml, regenerate-parser.yml)
# and merges that with review. What it cannot know is which parser release of
# this extension wants to adopt -- that is a decision made here, by merging a
# pin bump. Two repositories, two runners, no cross-repository tokens.
#
# The bump is verified before the PR is opened:
#   * the commit exists and carries src/parser.c (a grammar, not an empty tree);
#   * that parser.c and src/scanner.c compile at that commit;
#   * this extension still builds for wasm32-wasip1 against the pinned rev.

on:
  workflow_dispatch:
    inputs:
      rev:
        description: 'Commit SHA in miyako/tree-sitter-fourd. Empty means the tip of its default branch.'
        required: false
        default: ''
  schedule:
    # Weekly. The grammar repository regenerates on its own schedule; this
    # catches whatever it has merged since.
    - cron: '0 4 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-grammar
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GRAMMAR_REPOSITORY: https://github.com/miyako/tree-sitter-fourd
  MANIFEST: extension.toml
  BRANCH: ci/update-grammar-rev

jobs:
  bump:
    name: Pin the grammar revision
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve the grammar revision
        id: rev
        # Values reach the script through the environment: GitHub expands
        # ${{ }} into the script text, so a value is code as well as data.
        env:
          REQUESTED: ${{ inputs.rev }}
        run: |
          set -euo pipefail

          requested="${REQUESTED:-}"
          if [ -n "$requested" ]; then
            if ! printf '%s' "$requested" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::'$requested' is not a full 40-character commit SHA; the extension registry requires one"
              exit 1
            fi
            rev="$requested"
          else
            rev=$(git ls-remote "$GRAMMAR_REPOSITORY" HEAD | awk '{print $1}')
            test -n "$rev" || { echo "::error::could not resolve $GRAMMAR_REPOSITORY HEAD"; exit 1; }
          fi

          # The pin as committed. Read with the same pattern the update writes,
          # so the comparison cannot disagree with the edit.
          python3 - <<'PY' > "$RUNNER_TEMP/current-rev"
          import pathlib, re

          text = pathlib.Path("extension.toml").read_text()
          match = re.search(r'\[grammars\.fourd\][^\[]*?\brev\s*=\s*"([0-9a-fA-F]+)"', text, re.S)
          if not match:
              raise SystemExit("extension.toml has no rev under [grammars.fourd]")
          print(match.group(1))
          PY
          current=$(cat "$RUNNER_TEMP/current-rev")

          echo "current=$current"
          echo "rev=$rev"
          echo "new=$([ "$current" != "$rev" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$rev" ]; then
            echo "::notice::the pin already names $rev"
          fi

      - name: Verify the commit is a usable grammar
        id: verify
        if: steps.rev.outputs.new == 'true'
        env:
          CURRENT: ${{ steps.rev.outputs.current }}
          REV: ${{ steps.rev.outputs.rev }}
        run: |
          set -euo pipefail

          rev="$REV"
          clone="$RUNNER_TEMP/grammar"
          # A pinned SHA may be anywhere in history, so fetch it by name rather
          # than relying on a shallow tip.
          git init -q "$clone"
          git -C "$clone" remote add origin "$GRAMMAR_REPOSITORY"
          git -C "$clone" fetch -q --depth 1 origin "$rev"
          git -C "$clone" checkout -q FETCH_HEAD

          for file in src/parser.c src/scanner.c src/builtins.h src/tree_sitter/parser.h; do
            test -s "$clone/$file" || {
              echo "::error::$rev does not carry $file; it is not a generated tree-sitter grammar"
              find "$clone" -maxdepth 2 -type f | head -20
              exit 1
            }
          done

          cc -std=c11 -fsyntax-only -I"$clone/src" "$clone/src/parser.c"
          cc -std=c11 -fsyntax-only -I"$clone/src" "$clone/src/scanner.c"
          echo "parser.c and scanner.c compile at $rev"

          # Whether the parser itself moved decides whether this bump is worth a
          # version. src/ holds the generated artefacts and the scanner; a commit
          # that only touches docs, CI or the corpus leaves it identical, and a
          # version bump for that would publish a release with nothing in it.
          #
          # The exit status is read rather than relied on: `git diff --quiet`
          # returns 1 for "differs" and 128 for "cannot compare", and an `if` on
          # its status would read a broken fetch as "the parser changed".
          git -C "$clone" fetch -q --depth 1 origin "$CURRENT" 2>/dev/null || true
          status=0
          git -C "$clone" diff --quiet "$CURRENT" "$rev" -- src/ || status=$?
          case "$status" in
            0)
              echo "parser=false" >> "$GITHUB_OUTPUT"
              echo "src/ is identical between ${CURRENT:0:12} and ${rev:0:12}: pin-only bump"
              ;;
            1)
              echo "parser=true" >> "$GITHUB_OUTPUT"
              git -C "$clone" diff --stat "$CURRENT" "$rev" -- src/
              ;;
            *)
              # Comparison impossible, most likely because the pinned revision is
              # no longer reachable upstream. Treat the bump as one that changes
              # the parser -- a version that moves without need costs a patch
              # number, a parser that ships without a version is invisible -- and
              # say so, rather than deciding quietly.
              echo "parser=true" >> "$GITHUB_OUTPUT"
              echo "::warning::could not compare src/ between ${CURRENT:0:12} and ${rev:0:12} (git diff exit $status); assuming the parser changed"
              ;;
          esac

      - name: Verify the extension still builds
        if: steps.rev.outputs.new == 'true'
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip1
          cargo build --locked --release --target wasm32-wasip1
          test -s target/wasm32-wasip1/release/language_4dm_zed.wasm || {
            echo "::error::the extension did not produce a wasm module"
            find target/wasm32-wasip1 -name '*.wasm' | head
            exit 1
          }

      - name: Write the new pin
        if: steps.rev.outputs.new == 'true'
        env:
          REV: ${{ steps.rev.outputs.rev }}
        run: |
          set -euo pipefail
          python3 - "$REV" <<'PY'
          import re, sys, pathlib

          rev = sys.argv[1]
          path = pathlib.Path("extension.toml")
          text = path.read_text()
          # Anchored on the grammar's own table so a `rev` that belongs to some
          # other section is never the one rewritten.
          pattern = re.compile(r'(\[grammars\.fourd\][^\[]*?\brev\s*=\s*")[0-9a-fA-F]+(")', re.S)
          updated, count = pattern.subn(rf"\g<1>{rev}\g<2>", text, count=1)
          if count != 1:
              sys.exit("extension.toml no longer has a rev under [grammars.fourd]; update this workflow")
          path.write_text(updated)
          PY
          git diff -- "$MANIFEST"

      - name: Bump the version when the parser changed
        id: version
        if: steps.rev.outputs.new == 'true' && steps.verify.outputs.parser == 'true'
        env:
          REV: ${{ steps.rev.outputs.rev }}
        run: |
          set -euo pipefail

          python3 - "$REV" <<'PY' > "$RUNNER_TEMP/version"
          import re, sys, pathlib

          rev = sys.argv[1]
          path = pathlib.Path("extension.toml")
          text = path.read_text()
          # A patch bump: the extension's own surface -- the queries, the bridge,
          # the language server -- is untouched; what changes is the parser it
          # ships.
          pattern = re.compile(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', re.M)
          match = pattern.search(text)
          if not match:
              sys.exit("extension.toml has no version line; update this workflow")
          major, minor, patch = (int(part) for part in match.groups())
          bumped = f"{major}.{minor}.{patch + 1}"
          text = text[: match.start()] + f'version = "{bumped}"' + text[match.end():]
          path.write_text(text)
          print(bumped)
          PY
          version=$(cat "$RUNNER_TEMP/version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "src/ changed at $REV, so the version moves to $version"
          git diff -- "$MANIFEST"

      - name: Open pull request
        if: steps.rev.outputs.new == 'true'
        env:
          CURRENT: ${{ steps.rev.outputs.current }}
          REV: ${{ steps.rev.outputs.rev }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          current="$CURRENT"
          rev="$REV"
          version="${VERSION:-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$MANIFEST"
          if [ -n "$version" ]; then
            git commit -m "Pin grammar to ${rev:0:12}, version $version"
            title="Pin grammar to ${rev:0:12}, version $version"
          else
            git commit -m "Pin grammar to ${rev:0:12}"
            title="Pin grammar to ${rev:0:12}"
          fi
          git fetch --quiet origin "$BRANCH" || true
          # This push uses GITHUB_TOKEN, and GitHub does not run workflows for
          # events that token causes. For the pull_request event it still
          # creates a run, with zero jobs, that is recorded as failed -- "This
          # run likely failed because of a workflow file issue". It is not a
          # check: no check run is attached to the commit, `gh pr checks` says
          # "no checks reported", and re-running it reproduces the same run.
          # Nothing can be done about it here; the pull request is already
          # verified by this workflow, which builds the extension against the
          # new revision before opening it, and `main` is checked when the merge
          # lands. A token of its own would make CI run on the branch for real.
          git push --force-with-lease origin "$BRANCH"

          body=$(mktemp)
          {
            echo "Moves the grammar pin in \`$MANIFEST\` from \`${current:0:12}\` to \`${rev:0:12}\`."
            echo
            echo "Compare: $GRAMMAR_REPOSITORY/compare/${current}...${rev}"
            echo
            echo "Verified before this PR was opened: the commit carries a generated grammar,"
            echo "its \`parser.c\` and \`scanner.c\` compile, and this extension builds for"
            echo "\`wasm32-wasip1\` against it."
            echo
            echo "Not verified here: that the highlighting queries in \`languages/4d/\` still"
            echo 'match the parser'"'"'s node names. Zed reports a bad query when the extension is'
            echo 'installed; check the grammar'"'"'s `src/node-types.json` for the names the queries'
            echo 'reference before merging.'
            echo
            if [ -n "$version" ]; then
              echo "The parser changed, so \`version\` moves to \`$version\` in the same commit."
              echo "Merging this repo publishes nothing by itself: for the registry,"
              echo "\`zed-industries/extensions\` then needs this repository's submodule moved to"
              echo "the merge commit and its \`[fourd]\` version set to \`$version\`, in one update PR."
            else
              echo "\`src/\` is byte-identical between the two revisions, so \`version\` is left"
              echo "alone and this is a pointer move only -- it keeps the pin at the tip of the"
              echo "grammar repository without publishing a release that contains no change."
            fi
          } > "$body"

          # Captured rather than piped into `grep -q`, which can close the pipe
          # under `set -o pipefail` and fail the step on a successful lookup.
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$body"
          else
            gh pr create \
              --head "$BRANCH" \
              --base "$BASE_BRANCH" \
              --title "$title" \
              --body-file "$body"
          fi
