name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    name: Zed extension
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check formatting
        run: cargo fmt --check

      - name: Check extension
        run: cargo check --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build WebAssembly extension
        run: cargo build --locked --release --target wasm32-wasip1

  bridge:
    name: Native adapter (${{ matrix.os }})
    # Pull requests opened by a workflow -- the grammar pin bump -- carry a head
    # branch pushed with GITHUB_TOKEN, and GitHub refuses to run workflows for
    # those. The run still appears, with zero jobs and a red cross: it reads
    # like a failing check and is a refusal. `update-grammar.yml` already builds
    # the extension against the new revision before it opens the pull request,
    # and `main` is checked when the merge lands.
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge -> bridge/target

      - name: Check formatting
        run: cargo fmt --manifest-path bridge/Cargo.toml --check

      - name: Check adapter
        run: >
          cargo check
          --manifest-path bridge/Cargo.toml
          --locked
          --all-targets

      - name: Run Clippy
        run: >
          cargo clippy
          --manifest-path bridge/Cargo.toml
          --locked
          --all-targets
          --
          -D warnings

      - name: Run tests
        run: >
          cargo test
          --manifest-path bridge/Cargo.toml
          --locked

      - name: Build release adapter
        run: >
          cargo build
          --manifest-path bridge/Cargo.toml
          --locked
          --release

  windows:
    name: Check Windows adapter
    runs-on: windows-latest
    # Pull requests opened by a workflow -- the grammar pin bump -- carry a head
    # branch pushed with GITHUB_TOKEN, and GitHub refuses to run workflows for
    # those. The run still appears, with zero jobs and a red cross: it reads
    # like a failing check and is a refusal. `update-grammar.yml` already builds
    # the extension against the new revision before it opens the pull request,
    # and `main` is checked when the merge lands.
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
    
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
    
      - name: Check formatting
        shell: bash
        run: |
          cargo fmt \
            --manifest-path bridge/Cargo.toml \
            --check
    
      - name: Run Clippy
        shell: bash
        run: |
          cargo clippy \
            --manifest-path bridge/Cargo.toml \
            --locked \
            --all-targets \
            -- \
            -D warnings
    
      - name: Run tests
        shell: bash
        run: |
          cargo test \
            --manifest-path bridge/Cargo.toml \
            --locked
    
      - name: Build release adapter
        shell: bash
        run: |
          cargo build \
            --manifest-path bridge/Cargo.toml \
            --locked \
            --release
